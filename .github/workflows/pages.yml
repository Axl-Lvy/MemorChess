# Publishes the GitHub Pages site: the code provenance report at the root and the
# benchmark history page under benchmarks/, which loads its data from the
# benchmark-data branch at view time.
name: GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - '.github/scripts/code_provenance*'
      - '.github/scripts/test_*.py'
      - '.github/scripts/benchmark_history_page.html'
      - '.github/scripts/build_benchmark_history.py'
      - '.github/scripts/extract_benchmark_summary.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('provenance-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git blame needs the whole history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test the scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build the report
        run: python3 .github/scripts/code_provenance.py _site

      - name: Add the benchmark history page
        run: mkdir -p _site/benchmarks && cp .github/scripts/benchmark_history_page.html _site/benchmarks/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

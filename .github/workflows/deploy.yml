# Builds and publishes the :server sync backend image on every push to the default branch.
name: Deploy server

on:
  push:
    branches:
      - master # the repo's actual default branch; the spec says "main", see the PR description.
  workflow_dispatch:

concurrency:
  # Never cancel an in-flight push: it may already be pushing a tag, and cancelling it partway
  # could leave :latest and :<sha> pointing at different builds.
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # Same test as check.yml's jvm-tests job would run for :server, but deploy.yml has its own
  # trigger (push, not pull_request) so it cannot depend on that workflow.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Update local.properties
        run: .github/scripts/update_properties.sh

      - uses: gradle/actions/setup-gradle@v6

      - name: Run :server tests
        run: ./gradlew :server:test

      - name: Upload test result files
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-test-results
          path: server/build/test-results/test/*.xml
          retention-days: 1

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute short sha
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ steps.sha.outputs.sha }}
          tags: |
            ghcr.io/axl-lvy/memorchess-server:latest
            ghcr.io/axl-lvy/memorchess-server:${{ steps.sha.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

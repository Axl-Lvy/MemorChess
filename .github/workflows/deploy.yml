# Builds and publishes the :server sync backend image on every push to the default branch, and
# validates the Docker build (without pushing) on pull requests that touch it.
name: Deploy server

on:
  push:
    branches:
      - master # the repo's actual default branch. The spec says "main". See the PR description.
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  # Push and workflow_dispatch (which can target any ref) share one fixed group, so they can
  # never publish :latest at the same time from two different builds. A pull_request run gets
  # its own group keyed by PR number instead, so it can run alongside a deploy without queuing
  # behind it or blocking it. cancel in progress stays off for the deploy group so a publish is
  # never interrupted partway. A pull_request run may cancel freely since it publishes nothing.
  group: ${{ github.event_name == 'pull_request' && format('deploy-server-pr-{0}', github.event.pull_request.number) || 'deploy-server' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Same test as check.yml's jvm-tests job would run for :server. This job only runs for push
  # and workflow_dispatch though, since check.yml already covers pull_request, so it cannot
  # simply depend on that workflow.
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Update local.properties
        run: .github/scripts/update_properties.sh

      - uses: gradle/actions/setup-gradle@v6

      - name: Run :server tests
        run: ./gradlew :server:test

      - name: Upload test result files
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-test-results
          path: server/build/test-results/test/*.xml
          retention-days: 1

  build-and-push:
    needs: [test]
    # Guards against a workflow_dispatch on any ref other than master building that branch's
    # code and publishing it under the :latest tag with a token that can push packages.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # This job carries packages:write and both deploy secrets, unlike test/docker-build-check,
      # so its actions are pinned to a commit SHA rather than a mutable tag: a compromised action
      # release under a moving @v7 tag would otherwise get those secrets on the next run. Renovate
      # keeps the pins current (see PR #263 etc. for the equivalent pattern on the Dockerfile).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Compute short sha
        id: sha
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push the server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          build-args: |
            BUILD_SHA=${{ steps.sha.outputs.sha }}
          tags: |
            ghcr.io/axl-lvy/memorchess-server:latest
            ghcr.io/axl-lvy/memorchess-server:${{ steps.sha.outputs.sha }}

      - name: Trigger the mini PC deploy webhook
        # A Cloudflare Access application service token gates this hostname (dashboard-configured,
        # not scriptable — see docs/minipc-deploy-checklist.md #19.3): both headers below are
        # required for the tunnel to admit the request at all, on top of the bearer token the
        # webhook receiver itself checks. This repo is public, so the hostname and header names are
        # not secret; only the credential values are.
        env:
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl -f --max-time 30 -X POST \
            -H "Authorization: Bearer $DEPLOY_WEBHOOK_TOKEN" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            https://deploy-memorchess.axl-lvy.fr/hooks/deploy

  # Counterpart to build-and-push for a pull request: proves the image still builds, without
  # pushing anything and without needing registry credentials.
  docker-build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the server image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            BUILD_SHA=pr-check

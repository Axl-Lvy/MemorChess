# Nightly check that the catalog published on production still downloads and parses. Kept out of
# check.yml so a production outage never fails a pull request (#380).
name: Catalog canary

on:
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Update local.properties
        run: .github/scripts/update_properties.sh

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # --rerun because environment variables are not test task inputs, so a cache hit could
      # otherwise replay a result obtained without the URL.
      - name: Run the live catalog test
        env:
          MEMORCHESS_CATALOG_URL: https://memorchess.axl-lvy.fr/v1/repertoires
        run: >
          ./gradlew :composeApp:jvmTest
          --tests "proj.memorchess.axl.core.data.repertoire.TestRepertoireCatalogIntegration"
          --rerun

      # The test skips itself when the URL is missing, which would otherwise pass silently.
      - name: Fail unless the test actually ran
        run: |
          python3 - composeApp/build/test-results/jvmTest/TEST-proj.memorchess.axl.core.data.repertoire.TestRepertoireCatalogIntegration.xml <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          suite = ET.parse(sys.argv[1]).getroot()
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          if tests != 1 or skipped != 0:
              sys.exit(f"expected 1 executed test, got tests={tests} skipped={skipped}")
          print("live catalog test executed")
          EOF
